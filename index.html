<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a92e29"><link rel="manifest" href="manifest.json"><title>XiaoLong</title><style> *{box-sizing:border-box}body{margin:0;background:#f8f3e9;color:#302923;font:17px system-ui}main{max-width:560px;margin:auto;padding:22px}header{color:#a92e29;font-size:28px;font-weight:bold}button,select{font:inherit;border:1px solid #ded4c5;border-radius:12px;padding:14px;background:white;color:inherit;cursor:pointer}button{margin:5px 0;width:100%}nav{display:flex;gap:5px;margin:20px 0}nav button{padding:10px 4px;font-size:14px}.primary{background:#a92e29;color:white;border:0}.panel{background:white;border-radius:18px;padding:24px;margin:12px 0}.han{font-size:58px;color:#a92e29;text-align:center}.center{text-align:center}small{color:#75675b}progress{width:100%;accent-color:#a92e29}</style><main><header>龙 XiaoLong</header><small>Un poquito de chino cada día</small><nav><button onclick="home()">Aprender</button><button onclick="practice()">Practicar</button><button onclick="review()">Repasar</button><button onclick="stats()">Progreso</button></nav><section id="view"></section></main><script>
const lessons=[['Tonos y pinyin',[['妈','mā','Mamá'],['麻','má','Cáñamo'],['马','mǎ','Caballo'],['骂','mà','Regañar']]],['Saludos',[['你好','nǐ hǎo','Hola'],['谢谢','xièxie','Gracias'],['再见','zàijiàn','Adiós'],['晚安','wǎn’ān','Buenas noches'],['对不起','duìbuqǐ','Lo siento']]],['Números',[['一','yī','Uno'],['二','èr','Dos'],['三','sān','Tres'],['四','sì','Cuatro'],['五','wǔ','Cinco'],['六','liù','Seis'],['七','qī','Siete'],['八','bā','Ocho'],['九','jiǔ','Nueve'],['十','shí','Diez']]],['Presentaciones',[['我','wǒ','Yo'],['你','nǐ','Tú'],['我叫','wǒ jiào','Me llamo'],['我是','wǒ shì','Yo soy'],['很高兴认识你','hěn gāoxìng rènshi nǐ','Encantado de conocerte']]],['Comida y bebida',[['水','shuǐ','Agua'],['茶','chá','Té'],['米饭','mǐfàn','Arroz cocido'],['面条','miàntiáo','Fideos'],['我想喝水','wǒ xiǎng hē shuǐ','Quiero beber agua']]]];
let data={done:[],seen:[],miss:[],correct:0,total:0};try{Object.assign(data,JSON.parse(localStorage.getItem('xiaolong')||'{}'))}catch{};const save=()=>{try{localStorage.setItem('xiaolong',JSON.stringify(data))}catch{}};const v=document.querySelector('#view'),all=lessons.flatMap(l=>l[1]);let li=0,pos=0,queue=[],q=0,locked=false,mode='';function speak(h){if(!('speechSynthesis'in window)){alert('Audio no disponible');return}let u=new SpeechSynthesisUtterance(h);u.lang='zh-CN';u.rate=.8;let voice=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('zh-cn'));if(voice)u.voice=voice;speechSynthesis.cancel();speechSynthesis.speak(u)}function home(){v.innerHTML='<h2>Lecciones</h2>'+lessons.map((l,i)=>`<button onclick="start(${i})">${data.done.includes(i)?'✓ ':''}${i+1}. ${l[0]}</button>`).join('')}function start(i){li=i;pos=0;learn()}function learn(){let w=lessons[li][1][pos];if(!data.seen.includes(w[0]))data.seen.push(w[0]);save();v.innerHTML=`<h2>${lessons[li][0]}</h2><progress value="${pos+1}" max="${lessons[li][1].length}"></progress>${li===0?'<p><small>1º alto y plano · 2º ascendente · 3º descendente-ascendente · 4º descendente.</small></p>':''}<div class="panel center"><div class="han">${w[0]}</div><h2>${w[1]}</h2><p>${w[2]}</p><button onclick="speak(lessons[li][1][pos][0])">🔊 Escuchar</button></div><button class="primary" onclick="nextWord()">Continuar</button>`}function nextWord(){if(++pos<lessons[li][1].length)learn();else quiz(lessons[li][1],'lesson')}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function practice(){let a=all.filter(w=>data.seen.includes(w[0]));if(!a.length){v.innerHTML='<p>Empieza una lección primero.</p>';return}quiz(shuffle(a).slice(0,10),'practice')}function quiz(a,m){queue=a;q=0;mode=m;question()}function question(){locked=false;let w=queue[q];let opts=shuffle([w,...shuffle(all.filter(x=>x[2]!==w[2])).slice(0,3)]);v.innerHTML=`<h2>Practicar</h2><progress value="${q}" max="${queue.length}"></progress><div class="panel center"><div class="han">${w[0]}</div><p>${w[1]}</p><button onclick="speak(queue[q][0])">🔊 Escuchar</button></div><p>¿Qué significa?</p>`;opts.forEach(o=>{let b=document.createElement('button');b.textContent=o[2];b.onclick=()=>answer(o[2]===w[2],w,b);v.append(b)});v.insertAdjacentHTML('beforeend','<p id="feedback" role="status"></p><button id="next" class="primary" hidden onclick="advance()">Continuar</button>')}function answer(ok,w,b){if(locked)return;locked=true;data.total++;if(ok){data.correct++;data.miss=data.miss.filter(x=>x!==w[0])}else if(!data.miss.includes(w[0]))data.miss.push(w[0]);save();b.style.background=ok?'#dcebdc':'#f5d4cf';document.querySelector('#feedback').textContent=ok?'¡Correcto!':'Respuesta: '+w[2];document.querySelector('#next').hidden=false}function advance(){if(++q<queue.length)question();else{if(mode==='lesson'&&!data.done.includes(li))data.done.push(li);save();v.innerHTML='<h2>¡Bien hecho! 很好</h2><button class="primary" onclick="home()">Volver a lecciones</button>'}}function review(){let a=all.filter(w=>data.seen.includes(w[0]));v.innerHTML='<h2>Repasar</h2><button onclick="reviewMiss()">Repasar errores ('+data.miss.length+')</button>'+a.map(w=>`<div class="panel"><strong>${w[0]} · ${w[1]}</strong><p>${w[2]}</p><button onclick="speak('${w[0]}')">🔊 Escuchar</button></div>`).join('')}function reviewMiss(){let a=all.filter(w=>data.miss.includes(w[0]));if(a.length)quiz(a,'review');else alert('No hay errores pendientes')}function stats(){v.innerHTML=`<h2>Mi progreso</h2><div class="panel">Lecciones: ${data.done.length}/5<p>Expresiones vistas: ${data.seen.length}/${all.length}</p><p>Aciertos: ${data.correct}/${data.total}</p></div>`}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
