<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a92e29"><link rel="manifest" href="manifest.json"><title>XiaoLong</title><style> *{box-sizing:border-box}body{margin:0;background:#f8f3e9;color:#302923;font:17px system-ui}main{max-width:560px;margin:auto;padding:22px}header{color:#a92e29;font-size:28px;font-weight:bold}button,select{font:inherit;border:1px solid #ded4c5;border-radius:12px;padding:14px;background:white;color:inherit;cursor:pointer}button{margin:5px 0;width:100%}nav{display:flex;gap:5px;margin:20px 0}nav button{padding:10px 4px;font-size:14px}.primary{background:#a92e29;color:white;border:0}.panel{background:white;border-radius:18px;padding:24px;margin:12px 0}.han{font-size:58px;color:#a92e29;text-align:center}.center{text-align:center}small{color:#75675b}progress{width:100%;accent-color:#a92e29}main{padding:12px 16px 110px}nav{margin:10px 0}h2{margin:10px 0;font-size:21px}.panel{padding:12px;margin:8px 0}.han{font-size:44px}button{padding:9px;margin:3px 0}.panel p{margin:5px 0}.actions{position:fixed;bottom:0;left:0;right:0;background:#f8f3e9;padding:8px 16px max(8px,env(safe-area-inset-bottom));z-index:5;max-width:560px;margin:auto}.chosen{outline:2px solid #a92e29;background:#f8e4df}button:disabled{opacity:.65}#feedback{margin:3px 0} </style><main><header>龙 XiaoLong</header><small>Un poquito de chino cada día</small><nav><button onclick="home()">Aprender</button><button onclick="practice()">Practicar</button><button onclick="review()">Repasar</button><button onclick="stats()">Progreso</button></nav><section id="view"></section></main><script>
const lessons=[['Tonos y pinyin',[['妈','mā','Mamá'],['麻','má','Cáñamo'],['马','mǎ','Caballo'],['骂','mà','Regañar']]],['Saludos',[['你好','nǐ hǎo','Hola'],['谢谢','xièxie','Gracias'],['再见','zàijiàn','Adiós'],['晚安','wǎn’ān','Buenas noches'],['对不起','duìbuqǐ','Lo siento']]],['Números',[['一','yī','Uno'],['二','èr','Dos'],['三','sān','Tres'],['四','sì','Cuatro'],['五','wǔ','Cinco'],['六','liù','Seis'],['七','qī','Siete'],['八','bā','Ocho'],['九','jiǔ','Nueve'],['十','shí','Diez']]],['Presentaciones',[['我','wǒ','Yo'],['你','nǐ','Tú'],['我叫','wǒ jiào','Me llamo'],['我是','wǒ shì','Yo soy'],['很高兴认识你','hěn gāoxìng rènshi nǐ','Encantado de conocerte']]],['Comida y bebida',[['水','shuǐ','Agua'],['茶','chá','Té'],['米饭','mǐfàn','Arroz cocido'],['面条','miàntiáo','Fideos'],['我想喝水','wǒ xiǎng hē shuǐ','Quiero beber agua']]]];
lessons.push(...[["Tonos y tono neutro",[["妈妈","māma","Mamá (tono neutro)","ma-ma"],["好吗","hǎo ma","¿Está bien?","jao ma"],["不是","bú shì","No es","bu shí"]]],["Familia y amigos",[["家","jiā","Familia"],["朋友","péngyou","Amigo"],["爸爸","bàba","Papá"],["女儿","nǚ’ér","Hija"],["同事","tóngshì","Compañero de trabajo"]]],["Verbos básicos",[["去","qù","Ir"],["来","lái","Venir"],["看","kàn","Mirar"],["买","mǎi","Comprar"],["要","yào","Querer"],["有","yǒu","Tener"],["做","zuò","Hacer"]]],["Construir frases",[["我去东莞","wǒ qù Dōngguǎn","Voy a Dongguan"],["我想买","wǒ xiǎng mǎi","Quiero comprar"],["我在学中文","wǒ zài xué Zhōngwén","Estoy aprendiendo chino"],["我们有办公室","wǒmen yǒu bàngōngshì","Tenemos una oficina"]]],["Preguntas y negaciones",[["什么","shénme","Qué"],["哪里","nǎlǐ","Dónde"],["多少","duōshao","Cuánto"],["没有","méiyǒu","No tener"],["多少钱","duōshao qián","¿Cuánto cuesta?"]]],["Gustos y aficiones",[["喜欢","xǐhuan","Gustar"],["音乐","yīnyuè","Música"],["电影","diànyǐng","Película"],["书","shū","Libro"],["我喜欢音乐","wǒ xǐhuan yīnyuè","Me gusta la música"]]],["Primeras conversaciones",[["你好吗","nǐ hǎo ma","¿Cómo estás?"],["我很好","wǒ hěn hǎo","Estoy muy bien"],["请再说一遍","qǐng zài shuō yí biàn","Repítelo, por favor"],["我不懂","wǒ bù dǒng","No entiendo"],["请说慢一点","qǐng shuō màn yìdiǎn","Habla más despacio, por favor"]]]]);
let data={done:[],seen:[],miss:[],correct:0,total:0};try{Object.assign(data,JSON.parse(localStorage.getItem('xiaolong')||'{}'))}catch{};data.master ||= {}; data.tests ||= []; data.phonetic ??= true; const save=()=>{try{localStorage.setItem('xiaolong',JSON.stringify(data))}catch{}};const v=document.querySelector('#view'),all=lessons.flatMap(l=>l[1]);let li=0,pos=0,queue=[],q=0,locked=false,mode='';function speak(h){if(!('speechSynthesis'in window)){alert('Audio no disponible');return}let u=new SpeechSynthesisUtterance(h);u.lang='zh-CN';u.rate=.8;let voice=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('zh-cn'));if(voice)u.voice=voice;speechSynthesis.cancel();speechSynthesis.speak(u)}function home(){v.innerHTML='<h2>Lecciones</h2>'+lessons.map((l,i)=>`<button onclick="start(${i})">${data.done.includes(i)?'✓ ':''}${i+1}. ${l[0]}</button>`).join('')}function start(i){li=i;pos=0;learn()}function learn(){let w=lessons[li][1][pos];if(!data.seen.includes(w[0]))data.seen.push(w[0]);save();v.innerHTML=`<h2>${lessons[li][0]}</h2><progress value="${pos+1}" max="${lessons[li][1].length}"></progress>${li===0?'<p><small>1º alto y plano · 2º ascendente · 3º descendente-ascendente · 4º descendente.</small></p>':''}<div class="panel center"><div class="han">${w[0]}</div><h2>${w[1]}</h2>${phon(w)}<p>${w[2]}</p><button onclick="speak(lessons[li][1][pos][0])">🔊 Escuchar</button></div><button class="primary" onclick="nextWord()">Continuar</button>`}function nextWord(){if(++pos<lessons[li][1].length)learn();else quiz(lessons[li][1],'lesson')}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function practice(){let a=all.filter(w=>data.seen.includes(w[0]));if(!a.length){v.innerHTML='<p>Empieza una lección primero.</p>';return}quiz(shuffle(a).slice(0,10),'practice')}function quiz(a,m){queue=shuffle(a);q=0;mode=m;sessionCorrect=0;question()}let sessionCorrect=0,selected=null,kind='';const phonMap={'你好':'ni jao','谢谢':'sie-sie','再见':'tsai-chien','晚安':'uan-an','一':'i','二':'er','三':'san','四':'s (vocal muy breve)','五':'u','六':'liou','七':'chi (con aire)','八':'pa (sin aire)','九':'chiou (sin aire)','十':'shi','妈':'ma','麻':'ma','马':'ma','骂':'ma'};function phon(w){return data.phonetic&&(w[3]||phonMap[w[0]])?'<p><small>≈ '+(w[3]||phonMap[w[0]])+'</small></p>':''}function question(){locked=false;selected=null;let w=queue[q];kind=mode==='lesson'?'recognition':shuffle(['recognition','active','audio'])[0];let opts=shuffle([w,...shuffle(all.filter(x=>x[2]!==w[2]&&x[0]!==w[0])).slice(0,3)]);v.innerHTML=`<h2>Practicar · ${q+1}/${queue.length}</h2><progress value="${q}" max="${queue.length}"></progress><div class="panel center">${kind==='audio'?'Escucha el audio':kind==='active'?'<h2>'+w[2]+'</h2>':'<div class="han">'+w[0]+'</div><p>'+w[1]+'</p>'+phon(w)}${kind==='active'?'':'<button onclick="speak(queue[q][0])">🔊 Escuchar</button>'}</div><p>${kind==='active'?'¿Cómo se dice en chino?':'¿Qué significa?'}</p><div id="opts"></div><div class="actions"><p id="feedback" role="status"></p><button id="check" class="primary" disabled onclick="validate()">Comprobar respuesta</button><button id="next" class="primary" hidden onclick="advance()">Continuar</button></div>`;opts.forEach(o=>{let b=document.createElement('button');b.textContent=kind==='active'?o[0]+' · '+o[1]:o[2];b.onclick=()=>{if(locked)return;selected=o;document.querySelectorAll('#opts button').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');document.querySelector('#check').disabled=false};document.querySelector('#opts').append(b)})}function validate(){if(locked||!selected)return;locked=true;let w=queue[q],ok=selected===w;data.total++;let m=data.master[w[0]]||{hits:0,last:0,due:0,skills:[]};if(ok){data.correct++;sessionCorrect++;data.miss=data.miss.filter(x=>x!==w[0]);if(!m.last||Date.now()-m.last>=86400000)m.hits++;m.skills=[...new Set([...m.skills,kind])];m.last=Date.now();m.due=m.last+86400000*[1,3,7,14,30][Math.min(m.hits-1,4)]}else{if(!data.miss.includes(w[0]))data.miss.push(w[0]);m.hits=0;m.due=Date.now()}data.master[w[0]]=m;save();document.querySelectorAll('#opts button').forEach(x=>x.disabled=true);document.querySelector('#feedback').textContent=ok?'¡Correcto!':'Respuesta: '+w[0]+' · '+w[2];document.querySelector('#check').hidden=true;document.querySelector('#next').hidden=false}function advance(){if(++q<queue.length)question();else{if(mode==='lesson'&&!data.done.includes(li))data.done.push(li);data.tests.push({date:Date.now(),correct:sessionCorrect,total:queue.length,mode});save();v.innerHTML='<h2>¡Bien hecho! 很好</h2><p>Resultado: '+sessionCorrect+'/'+queue.length+'</p><button class="primary" onclick="home()">Volver a lecciones</button>'}}function review(){let a=all.filter(w=>data.seen.includes(w[0]));v.innerHTML='<h2>Repasar</h2><button onclick="reviewMiss()">Repasar errores ('+data.miss.length+')</button>'+a.map(w=>`<div class="panel"><strong>${w[0]} · ${w[1]}</strong><p>${w[2]}</p><button onclick="speak('${w[0]}')">🔊 Escuchar</button></div>`).join('')}function reviewMiss(){let a=all.filter(w=>data.miss.includes(w[0]));if(a.length)quiz(a,'review');else alert('No hay errores pendientes')}function weekly(){let a=all.filter(w=>data.seen.includes(w[0]));if(a.length)quiz(shuffle(a).slice(0,20),'weekly');else home()}function due(){let a=all.filter(w=>data.seen.includes(w[0])&&(!data.master[w[0]]||data.master[w[0]].due<=Date.now()));if(a.length)quiz(shuffle(a).slice(0,20),'review');else alert('No hay repasos pendientes')}function stats(){let mastered=Object.values(data.master).filter(m=>m.hits>=3&&m.skills.length>=2).length;let milestones=[['2026-12-20',80,'Bases'],['2027-01-17',150,'Conversación'],['2027-02-14',230,'Viajes'],['2027-03-14',320,'Oficina y producto'],['2027-04-11',400,'Canton Fair'],['2027-04-20',400,'Repaso final']];let last=data.tests.filter(t=>t.mode==='weekly').at(-1);v.innerHTML=`<h2>Operación abril 2027</h2><div class="panel">Lecciones: ${data.done.length}/${lessons.length}<p>Expresiones vistas: ${data.seen.length}</p><p>Dominadas: ${mastered}/400</p><progress value="${mastered}" max="400"></progress><p>Aciertos históricos: ${data.correct}/${data.total}</p><p>Último test semanal: ${last?Math.round(last.correct/last.total*100)+'%':'Pendiente'}</p></div><button onclick="weekly()">Test acumulativo</button><button onclick="due()">Repaso programado</button><button onclick="data.phonetic=!data.phonetic;save();stats()">Ayuda fonética: ${data.phonetic?'activada':'desactivada'}</button><h2>Hoja de ruta</h2>${milestones.map(m=>'<div class="panel">'+m[2]+' · '+m[0]+'<p>Meta: '+m[1]+' expresiones</p></div>').join('')}<small>Dominio: tres días de aciertos y dos tipos de ejercicio. Pronunciación oral pendiente de evaluación.</small>`} home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
